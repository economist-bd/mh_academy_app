name: Build MH Academy App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      # ধাপ ১: অ্যান্ড্রয়েড ফাইল তৈরি করা
      - name: Recreate Android Files
        run: flutter create --project-name mh_academy_app .

      # ধাপ ২: ইন্টারনেট পারমিশন যুক্ত করা (নতুন যুক্ত করা হয়েছে)
      - name: Add Internet Permission
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|g' android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mh-academy-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
